<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — wage tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D0C;
    --bg-raised:#121513;
    --bg-line:#1C201D;
    --ink:#EDEAE3;
    --ink-dim:#8B9088;
    --ink-faint:#4E534E;
    --signal:#B8FF3C;
    --signal-dim:#6B7F3A;
    --danger:#FF6B4A;
    --radius:2px;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:4rem;
  }
  ::selection{background:var(--signal); color:var(--bg);}

  /* ===== Top bar ===== */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(11,13,12,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--bg-line);
    padding:0.9rem 1.25rem;
    display:flex; align-items:center; justify-content:space-between;
    gap:1rem;
  }
  .brand{
    display:flex; align-items:baseline; gap:0.5rem;
    font-family:var(--mono);
  }
  .brand .mark{
    color:var(--signal);
    font-weight:700;
  }
  .brand .name{
    font-size:0.95rem; font-weight:600; letter-spacing:0.01em;
  }
  .brand .tag{
    color:var(--ink-faint); font-size:0.7rem; letter-spacing:0.04em;
  }
  .header-actions{display:flex; gap:0.5rem;}
  .icon-btn{
    background:none; border:1px solid var(--bg-line); color:var(--ink-dim);
    width:32px; height:32px; border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:0.9rem; transition:border-color .15s, color .15s;
  }
  .icon-btn:hover{border-color:var(--ink-faint); color:var(--ink);}

  main{max-width:640px; margin:0 auto; padding:0 1.25rem;}

  /* ===== Live counter (signature element) ===== */
  .live-panel{
    margin-top:1.5rem;
    border:1px solid var(--bg-line);
    background:linear-gradient(180deg, var(--bg-raised), var(--bg));
    border-radius:var(--radius);
    padding:1.5rem 1.25rem;
    position:relative;
    overflow:hidden;
  }
  .live-panel::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:1px;
    background:var(--bg-line);
  }
  .live-status-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:0.9rem;
  }
  .live-label{
    font-family:var(--mono); font-size:0.72rem; letter-spacing:0.08em;
    color:var(--ink-faint); text-transform:uppercase;
    display:flex; align-items:center; gap:0.4rem;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--ink-faint);
  }
  .dot.active{
    background:var(--signal);
    box-shadow:0 0 0 0 rgba(184,255,60,0.5);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(184,255,60,0.45);}
    70%{box-shadow:0 0 0 8px rgba(184,255,60,0);}
    100%{box-shadow:0 0 0 0 rgba(184,255,60,0);}
  }
  .live-figure{
    font-family:var(--mono); font-weight:700;
    font-size:clamp(2.4rem, 9vw, 3.4rem);
    line-height:1;
    letter-spacing:-0.01em;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .live-figure.earning{color:var(--signal);}
  .live-figure .cents{font-size:0.55em; color:var(--ink-dim);}
  .live-sub{
    margin-top:0.5rem;
    font-family:var(--mono); font-size:0.78rem; color:var(--ink-dim);
  }
  .live-sub b{color:var(--ink);}

  .shift-controls{
    margin-top:1.4rem;
    display:flex; gap:0.6rem; flex-wrap:wrap;
    align-items:center;
  }
  select, input[type="number"], input[type="text"], input[type="date"], input[type="time"]{
    background:var(--bg);
    border:1px solid var(--bg-line);
    color:var(--ink);
    font-family:var(--sans);
    font-size:0.85rem;
    padding:0.55rem 0.7rem;
    border-radius:var(--radius);
    outline:none;
    transition:border-color .15s;
  }
  select:focus, input:focus{border-color:var(--signal-dim);}
  select{flex:1; min-width:140px; cursor:pointer;}

  .btn{
    font-family:var(--mono); font-weight:600; font-size:0.8rem;
    letter-spacing:0.02em;
    padding:0.6rem 1.1rem;
    border-radius:var(--radius);
    border:1px solid transparent;
    cursor:pointer;
    transition:opacity .15s, transform .1s;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn-start{background:var(--signal); color:#0B0D0C;}
  .btn-start:hover{opacity:0.88;}
  .btn-stop{background:var(--danger); color:#1A0D08;}
  .btn-stop:hover{opacity:0.88;}
  .btn-ghost{
    background:none; border:1px solid var(--bg-line); color:var(--ink-dim);
  }
  .btn-ghost:hover{border-color:var(--ink-faint); color:var(--ink);}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}

  /* ===== Wage config ===== */
  .config-row{
    display:flex; gap:0.6rem; margin-top:0.7rem; flex-wrap:wrap;
  }
  .config-row .field{flex:1; min-width:110px;}
  .field label{
    display:block; font-family:var(--mono); font-size:0.66rem;
    letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint);
    margin-bottom:0.3rem;
  }
  .field input, .field select{width:100%;}

  /* ===== Summary strip ===== */
  .summary-strip{
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:1px; background:var(--bg-line);
    margin-top:1.25rem; border-radius:var(--radius); overflow:hidden;
    border:1px solid var(--bg-line);
  }
  .summary-cell{
    background:var(--bg-raised);
    padding:0.85rem 0.9rem;
  }
  .summary-cell .k{
    font-family:var(--mono); font-size:0.64rem; letter-spacing:0.07em;
    color:var(--ink-faint); text-transform:uppercase;
  }
  .summary-cell .v{
    font-family:var(--mono); font-weight:700; font-size:1.15rem;
    margin-top:0.25rem; font-variant-numeric:tabular-nums;
  }
  .summary-cell .v.signal{color:var(--signal);}
  .summary-cell .sub{font-size:0.68rem; color:var(--ink-dim); margin-top:0.15rem; font-family:var(--mono);}

  /* ===== Range tabs ===== */
  .range-tabs{
    display:flex; gap:0.4rem; margin-top:1.5rem;
    border-bottom:1px solid var(--bg-line);
    padding-bottom:0;
  }
  .range-tab{
    background:none; border:none; color:var(--ink-faint);
    font-family:var(--mono); font-size:0.75rem; letter-spacing:0.03em;
    padding:0.5rem 0.2rem; cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    text-transform:uppercase;
    transition:color .15s, border-color .15s;
  }
  .range-tab + .range-tab{margin-left:0.9rem;}
  .range-tab.active{color:var(--ink); border-color:var(--signal);}
  .range-tab:hover{color:var(--ink);}

  /* ===== Ledger ===== */
  .ledger{margin-top:1rem;}
  .ledger-group{margin-bottom:1.1rem;}
  .ledger-group-label{
    font-family:var(--mono); font-size:0.68rem; letter-spacing:0.05em;
    color:var(--ink-faint); text-transform:uppercase;
    padding:0.4rem 0;
    display:flex; justify-content:space-between;
  }
  .entry{
    display:flex; align-items:center; gap:0.9rem;
    padding:0.7rem 0.85rem;
    background:var(--bg-raised);
    border:1px solid var(--bg-line);
    border-radius:var(--radius);
    margin-bottom:0.4rem;
  }
  .entry-date{
    font-family:var(--mono); font-size:0.75rem; color:var(--ink-dim);
    width:2.6rem; flex-shrink:0;
  }
  .entry-main{flex:1; min-width:0;}
  .entry-label{
    font-size:0.85rem; font-weight:500; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .entry-meta{
    font-family:var(--mono); font-size:0.7rem; color:var(--ink-faint);
    margin-top:0.15rem;
  }
  .entry-amount{
    font-family:var(--mono); font-weight:700; font-size:0.95rem;
    color:var(--signal); flex-shrink:0; font-variant-numeric:tabular-nums;
  }
  .entry-del{
    background:none; border:none; color:var(--ink-faint);
    cursor:pointer; font-size:1rem; padding:0.2rem 0.3rem; flex-shrink:0;
    transition:color .15s;
  }
  .entry-del:hover{color:var(--danger);}

  .empty-state{
    text-align:center; padding:3rem 1rem;
    color:var(--ink-faint);
  }
  .empty-state .glyph{
    font-family:var(--mono); font-size:1.6rem; color:var(--ink-faint);
    margin-bottom:0.6rem;
  }
  .empty-state p{font-size:0.85rem; max-width:280px; margin:0 auto; line-height:1.5;}

  /* ===== Manual add form (collapsible) ===== */
  .manual-toggle{
    margin-top:1.5rem;
    width:100%;
    background:none; border:1px dashed var(--bg-line); color:var(--ink-dim);
    font-family:var(--mono); font-size:0.75rem; letter-spacing:0.03em;
    padding:0.65rem; border-radius:var(--radius); cursor:pointer;
    text-transform:uppercase;
  }
  .manual-toggle:hover{border-color:var(--ink-faint); color:var(--ink);}
  .manual-form{
    margin-top:0.7rem; padding:1rem;
    border:1px solid var(--bg-line); border-radius:var(--radius);
    background:var(--bg-raised);
    display:none;
  }
  .manual-form.open{display:block;}
  .manual-form .config-row:first-child{margin-top:0;}
  .manual-form .btn{margin-top:0.9rem; width:100%;}

  /* ===== Footer / data controls ===== */
  footer{
    max-width:640px; margin:2.5rem auto 0; padding:0 1.25rem;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:0.6rem;
  }
  footer .note{
    font-family:var(--mono); font-size:0.68rem; color:var(--ink-faint);
    line-height:1.6; max-width:320px;
  }
  .footer-btns{display:flex; gap:0.5rem;}
  .footer-btns .btn{font-size:0.7rem; padding:0.45rem 0.7rem;}

  /* ===== Settings modal ===== */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50; backdrop-filter:blur(2px);
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--bg-raised); border:1px solid var(--bg-line);
    border-radius:var(--radius) var(--radius) 0 0;
    width:100%; max-width:640px;
    padding:1.5rem 1.25rem 2rem;
    max-height:85vh; overflow-y:auto;
  }
  @media (min-width:640px){
    .modal-backdrop{align-items:center;}
    .modal{border-radius:var(--radius); max-height:80vh;}
  }
  .modal h2{
    font-family:var(--mono); font-size:1rem; margin-bottom:1rem;
    display:flex; justify-content:space-between; align-items:center;
  }
  .rate-list{margin-top:0.8rem;}
  .rate-row{
    display:flex; gap:0.5rem; align-items:flex-end; margin-bottom:0.6rem;
  }
  .rate-row .field{flex:1;}
  .rate-row .btn-ghost{padding:0.55rem 0.6rem;}

  @media (max-width:420px){
    .summary-strip{grid-template-columns:1fr 1fr;}
    .summary-cell:last-child{grid-column:1 / -1;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">$</span>
    <span class="name">ledger</span>
    <span class="tag">// local wage tracker</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="settingsBtn" title="Rates & settings">⚙</button>
  </div>
</header>

<main>

  <!-- LIVE PANEL -->
  <section class="live-panel">
    <div class="live-status-row">
      <span class="live-label"><span class="dot" id="statusDot"></span><span id="statusText">No shift running</span></span>
      <span class="live-label" id="rateLabel">—</span>
    </div>
    <div class="live-figure" id="liveFigure">$0<span class="cents">.00</span></div>
    <div class="live-sub" id="liveSub">Start a shift to begin tracking.</div>

    <div class="shift-controls">
      <select id="rateSelect"></select>
      <button class="btn btn-start" id="startBtn">▶ Start shift</button>
      <button class="btn btn-stop" id="stopBtn" style="display:none;">■ Stop & log</button>
    </div>
  </section>

  <!-- SUMMARY -->
  <div class="summary-strip">
    <div class="summary-cell">
      <div class="k">This week</div>
      <div class="v signal" id="sumWeek">$0.00</div>
      <div class="sub" id="sumWeekHrs">0.0 hrs</div>
    </div>
    <div class="summary-cell">
      <div class="k">This month</div>
      <div class="v signal" id="sumMonth">$0.00</div>
      <div class="sub" id="sumMonthHrs">0.0 hrs</div>
    </div>
    <div class="summary-cell">
      <div class="k">All time</div>
      <div class="v" id="sumAll">$0.00</div>
      <div class="sub" id="sumAllHrs">0.0 hrs</div>
    </div>
  </div>

  <!-- RANGE TABS -->
  <div class="range-tabs">
    <button class="range-tab active" data-range="week">Week</button>
    <button class="range-tab" data-range="month">Month</button>
    <button class="range-tab" data-range="all">All time</button>
  </div>

  <!-- LEDGER -->
  <div class="ledger" id="ledger"></div>

  <!-- MANUAL ENTRY -->
  <button class="manual-toggle" id="manualToggle">+ Add shift manually</button>
  <div class="manual-form" id="manualForm">
    <div class="config-row">
      <div class="field">
        <label>Label</label>
        <input type="text" id="manLabel" placeholder="e.g. VELINX — client call">
      </div>
    </div>
    <div class="config-row">
      <div class="field">
        <label>Date</label>
        <input type="date" id="manDate">
      </div>
      <div class="field">
        <label>Rate</label>
        <select id="manRateSelect"></select>
      </div>
    </div>
    <div class="config-row">
      <div class="field">
        <label>Hours</label>
        <input type="number" id="manHours" step="0.25" min="0" placeholder="e.g. 3.5">
      </div>
      <div class="field">
        <label>Override $ (optional)</label>
        <input type="number" id="manOverride" step="0.01" min="0" placeholder="flat amount">
      </div>
    </div>
    <button class="btn btn-start" id="manSubmit">Add to ledger</button>
  </div>

</main>

<footer>
  <div class="note">Everything lives in this browser's localStorage. Nothing is sent anywhere. Clearing site data erases it — export first if you care.</div>
  <div class="footer-btns">
    <button class="btn btn-ghost" id="exportBtn">Export JSON</button>
    <button class="btn btn-ghost" id="importBtn">Import</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>
</footer>

<!-- SETTINGS MODAL -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <h2>Rates <button class="icon-btn" id="closeSettings">✕</button></h2>
    <div class="rate-list" id="rateList"></div>
    <button class="btn btn-ghost" id="addRateBtn" style="width:100%; margin-top:0.4rem;">+ Add rate</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = 'ledger_v1_state';
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ console.error('Failed to load state', e); }
    return {
      rates: [{ id: uid(), name: 'Default', amount: 30 }],
      activeRateId: null,
      entries: [],
      shift: null // { rateId, startedAt }
    };
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = loadState();
  if(!state.rates || state.rates.length === 0){
    state.rates = [{ id: uid(), name: 'Default', amount: 30 }];
  }
  if(!state.activeRateId || !state.rates.find(r => r.id === state.activeRateId)){
    state.activeRateId = state.rates[0].id;
  }

  // ---------- helpers ----------
  function money(n){
    return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function moneySplit(n){
    const v = Math.max(0, Number(n) || 0);
    const whole = Math.floor(v);
    const cents = Math.round((v - whole) * 100).toString().padStart(2,'0');
    return { whole: '$' + whole.toLocaleString('en-US'), cents: '.' + cents };
  }
  function startOfWeek(d){
    const date = new Date(d);
    const day = date.getDay(); // 0 = Sunday
    const diff = (day === 0 ? -6 : 1) - day; // Monday as start
    date.setHours(0,0,0,0);
    date.setDate(date.getDate() + diff);
    return date;
  }
  function startOfMonth(d){
    const date = new Date(d);
    date.setDate(1); date.setHours(0,0,0,0);
    return date;
  }
  function getRate(id){
    return state.rates.find(r => r.id === id) || state.rates[0];
  }

  // ---------- rate selects ----------
  function renderRateSelects(){
    const opts = state.rates.map(r => `<option value="${r.id}">${escapeHtml(r.name)} — $${r.amount}/hr</option>`).join('');
    $('#rateSelect').innerHTML = opts;
    $('#rateSelect').value = state.activeRateId;
    $('#manRateSelect').innerHTML = opts;
    $('#manRateSelect').value = state.activeRateId;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- live shift ----------
  let tickHandle = null;

  function startShift(){
    const rateId = $('#rateSelect').value;
    state.activeRateId = rateId;
    state.shift = { rateId, startedAt: Date.now() };
    saveState();
    renderShiftUI();
    startTicking();
  }

  function stopShift(){
    if(!state.shift) return;
    const rate = getRate(state.shift.rateId);
    const ms = Date.now() - state.shift.startedAt;
    const hours = ms / 3600000;
    if(hours * 3600 >= 10){ // ignore accidental sub-10-second starts
      state.entries.push({
        id: uid(),
        label: rate.name,
        rateId: rate.id,
        rateAmount: rate.amount,
        hours: Math.round(hours * 100) / 100,
        amount: Math.round(hours * rate.amount * 100) / 100,
        date: new Date().toISOString().slice(0,10),
        createdAt: Date.now()
      });
    }
    state.shift = null;
    saveState();
    stopTicking();
    renderShiftUI();
    renderAll();
  }

  function startTicking(){
    stopTicking();
    tickHandle = setInterval(renderLiveFigure, 250);
    renderLiveFigure();
  }
  function stopTicking(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }

  function renderLiveFigure(){
    const fig = $('#liveFigure');
    const sub = $('#liveSub');
    if(state.shift){
      const rate = getRate(state.shift.rateId);
      const ms = Date.now() - state.shift.startedAt;
      const hours = ms / 3600000;
      const earned = hours * rate.amount;
      const { whole, cents } = moneySplit(earned);
      fig.className = 'live-figure earning';
      fig.innerHTML = `${whole}<span class="cents">${cents}</span>`;
      const h = Math.floor(hours);
      const m = Math.floor((hours - h) * 60);
      const s = Math.floor(ms/1000) % 60;
      sub.innerHTML = `<b>${h}h ${m}m ${s}s</b> elapsed at ${money(rate.amount)}/hr — ${escapeHtml(rate.name)}`;
    } else {
      fig.className = 'live-figure';
      fig.innerHTML = '$0<span class="cents">.00</span>';
      sub.textContent = 'Start a shift to begin tracking.';
    }
  }

  function renderShiftUI(){
    const running = !!state.shift;
    $('#startBtn').style.display = running ? 'none' : '';
    $('#stopBtn').style.display = running ? '' : 'none';
    $('#rateSelect').disabled = running;
    $('#statusDot').classList.toggle('active', running);
    $('#statusText').textContent = running ? 'Shift in progress' : 'No shift running';
    const rate = getRate(running ? state.shift.rateId : $('#rateSelect').value);
    $('#rateLabel').textContent = rate ? `${rate.name} · ${money(rate.amount)}/hr` : '—';
    renderLiveFigure();
  }

  // ---------- summary ----------
  function sumEntries(entries){
    return entries.reduce((acc, e) => {
      acc.amount += e.amount;
      acc.hours += e.hours;
      return acc;
    }, { amount: 0, hours: 0 });
  }

  function renderSummary(){
    const now = new Date();
    const wStart = startOfWeek(now);
    const mStart = startOfMonth(now);

    const weekEntries = state.entries.filter(e => new Date(e.date + 'T00:00:00') >= wStart);
    const monthEntries = state.entries.filter(e => new Date(e.date + 'T00:00:00') >= mStart);
    const allEntries = state.entries;

    const w = sumEntries(weekEntries);
    const m = sumEntries(monthEntries);
    const a = sumEntries(allEntries);

    $('#sumWeek').textContent = money(w.amount);
    $('#sumWeekHrs').textContent = w.hours.toFixed(1) + ' hrs';
    $('#sumMonth').textContent = money(m.amount);
    $('#sumMonthHrs').textContent = m.hours.toFixed(1) + ' hrs';
    $('#sumAll').textContent = money(a.amount);
    $('#sumAllHrs').textContent = a.hours.toFixed(1) + ' hrs';
  }

  // ---------- ledger list ----------
  let activeRange = 'week';

  function fmtDateShort(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }

  function renderLedger(){
    const now = new Date();
    let cutoff = null;
    if(activeRange === 'week') cutoff = startOfWeek(now);
    if(activeRange === 'month') cutoff = startOfMonth(now);

    let entries = [...state.entries];
    if(cutoff){
      entries = entries.filter(e => new Date(e.date + 'T00:00:00') >= cutoff);
    }
    entries.sort((a,b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));

    const container = $('#ledger');
    if(entries.length === 0){
      container.innerHTML = `
        <div class="empty-state">
          <div class="glyph">·&nbsp;·&nbsp;·</div>
          <p>No shifts logged for this range yet. Start a shift above or add one manually.</p>
        </div>`;
      return;
    }

    // group by date
    const groups = {};
    entries.forEach(e => {
      if(!groups[e.date]) groups[e.date] = [];
      groups[e.date].push(e);
    });

    let html = '';
    Object.keys(groups).sort().reverse().forEach(date => {
      const dayEntries = groups[date];
      const dayTotal = sumEntries(dayEntries).amount;
      html += `<div class="ledger-group">
        <div class="ledger-group-label"><span>${fmtDateShort(date)}</span><span>${money(dayTotal)}</span></div>`;
      dayEntries.forEach(e => {
        html += `
          <div class="entry" data-id="${e.id}">
            <div class="entry-main">
              <div class="entry-label">${escapeHtml(e.label)}</div>
              <div class="entry-meta">${e.hours.toFixed(2)} hrs @ ${money(e.rateAmount)}/hr</div>
            </div>
            <div class="entry-amount">${money(e.amount)}</div>
            <button class="entry-del" data-del="${e.id}" title="Delete entry">✕</button>
          </div>`;
      });
      html += `</div>`;
    });
    container.innerHTML = html;
  }

  function deleteEntry(id){
    state.entries = state.entries.filter(e => e.id !== id);
    saveState();
    renderAll();
  }

  // ---------- settings modal ----------
  function renderRateList(){
    const html = state.rates.map(r => `
      <div class="rate-row" data-rate-id="${r.id}">
        <div class="field">
          <label>Name</label>
          <input type="text" class="rate-name" value="${escapeHtml(r.name)}">
        </div>
        <div class="field" style="max-width:110px;">
          <label>$/hr</label>
          <input type="number" class="rate-amount" step="0.01" min="0" value="${r.amount}">
        </div>
        <button class="btn btn-ghost rate-del" ${state.rates.length <= 1 ? 'disabled' : ''}>✕</button>
      </div>
    `).join('');
    $('#rateList').innerHTML = html;
  }

  function saveRatesFromModal(){
    const rows = $$('.rate-row');
    const newRates = [];
    rows.forEach(row => {
      const id = row.getAttribute('data-rate-id');
      const name = row.querySelector('.rate-name').value.trim() || 'Untitled';
      const amount = parseFloat(row.querySelector('.rate-amount').value) || 0;
      newRates.push({ id, name, amount });
    });
    if(newRates.length){
      state.rates = newRates;
      if(!state.rates.find(r => r.id === state.activeRateId)){
        state.activeRateId = state.rates[0].id;
      }
      saveState();
      renderRateSelects();
      renderShiftUI();
      renderLedger();
    }
  }

  // ---------- render all ----------
  function renderAll(){
    renderRateSelects();
    renderShiftUI();
    renderSummary();
    renderLedger();
  }

  // ---------- events ----------
  $('#startBtn').addEventListener('click', startShift);
  $('#stopBtn').addEventListener('click', stopShift);
  $('#rateSelect').addEventListener('change', renderShiftUI);

  $$('.range-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $$('.range-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeRange = tab.getAttribute('data-range');
      renderLedger();
    });
  });

  $('#ledger').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-del]');
    if(btn) deleteEntry(btn.getAttribute('data-del'));
  });

  $('#manualToggle').addEventListener('click', () => {
    const form = $('#manualForm');
    form.classList.toggle('open');
    if(form.classList.contains('open')){
      $('#manDate').value = new Date().toISOString().slice(0,10);
    }
  });

  $('#manSubmit').addEventListener('click', () => {
    const label = $('#manLabel').value.trim();
    const date = $('#manDate').value || new Date().toISOString().slice(0,10);
    const rateId = $('#manRateSelect').value;
    const rate = getRate(rateId);
    const hours = parseFloat($('#manHours').value) || 0;
    const overrideVal = $('#manOverride').value;
    if(hours <= 0 && !overrideVal){
      $('#manHours').focus();
      return;
    }
    const amount = overrideVal ? parseFloat(overrideVal) : Math.round(hours * rate.amount * 100) / 100;
    state.entries.push({
      id: uid(),
      label: label || rate.name,
      rateId: rate.id,
      rateAmount: rate.amount,
      hours: hours,
      amount: amount,
      date: date,
      createdAt: Date.now()
    });
    saveState();
    $('#manLabel').value = '';
    $('#manHours').value = '';
    $('#manOverride').value = '';
    $('#manualForm').classList.remove('open');
    renderAll();
  });

  $('#settingsBtn').addEventListener('click', () => {
    renderRateList();
    $('#settingsModal').classList.add('open');
  });
  $('#closeSettings').addEventListener('click', () => {
    saveRatesFromModal();
    $('#settingsModal').classList.remove('open');
  });
  $('#settingsModal').addEventListener('click', (e) => {
    if(e.target.id === 'settingsModal'){
      saveRatesFromModal();
      $('#settingsModal').classList.remove('open');
    }
  });
  $('#addRateBtn').addEventListener('click', () => {
    state.rates.push({ id: uid(), name: 'New rate', amount: 25 });
    saveState();
    renderRateList();
  });
  $('#rateList').addEventListener('click', (e) => {
    if(e.target.classList.contains('rate-del')){
      const row = e.target.closest('.rate-row');
      const id = row.getAttribute('data-rate-id');
      if(state.rates.length > 1){
        state.rates = state.rates.filter(r => r.id !== id);
        saveState();
        renderRateList();
      }
    }
  });

  // export / import
  $('#exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ledger-export-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const imported = JSON.parse(reader.result);
        if(imported && Array.isArray(imported.entries) && Array.isArray(imported.rates)){
          state = imported;
          if(!state.activeRateId || !state.rates.find(r => r.id === state.activeRateId)){
            state.activeRateId = state.rates[0] ? state.rates[0].id : null;
          }
          state.shift = null;
          saveState();
          renderAll();
        } else {
          alert('That file doesn\'t look like a ledger export.');
        }
      }catch(err){
        alert('Could not read that file.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // resume live shift if one was running when tab closed
  if(state.shift){
    startTicking();
  }

  // re-render summary/ledger periodically in case day/week rolls over while open
  setInterval(() => { renderSummary(); }, 30000);

  renderAll();
})();
</script>
</body>
</html>
